name: Build Mac Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: ['codex/macos-installer']

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build-macos.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Offline platform contracts
        run: python -m unittest discover -s tests -p test_macos.py -v
      - name: Build and verify frozen app before DMG
        run: python scripts/build_macos_package.py
      - name: Keep verified installer
        uses: actions/upload-artifact@v4
        with:
          name: Afirma-Mac-Apple-Silicon
          path: output/macos-installer/*
          if-no-files-found: error
      - name: Keep diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mac-diagnostics
          path: output/macos-verification/diagnostics.json
          if-no-files-found: ignore
